plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version+$minecraft_version"
    modLocalRuntime "dev.emi:emi-fabric:$emi_version+$minecraft_version"

    // Optional compat dependencies
    modCompileOnly("maven.modrinth:columns:${columns_version}")
    modImplementation("maven.modrinth:more-chest-variants-lieonlion:${chest_variants_version}-Fabric")
        modLocalRuntime("maven.modrinth:quad:${quad_version}-Fabric")
    modImplementation("vectorwing:FarmersDelight:${fdrf_version}") {
        exclude(group: "net.fabricmc")
    }
    modImplementation("maven.modrinth:totally-lit:${totally_lit_version}")
        modImplementation "io.wispforest:owo-lib:${project.owo_version}"

    // Configs
    implementation(include("folk.sisby:kaleido-config:${kaleido_version}"))
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}")
    modImplementation "maven.modrinth:mcqoy:$mcqoy_version"
    modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")

    // Architectury API. This is optional, and you can comment it out if you don't need it.
//    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    // Compatibility dependencies
//    modImplementation("com.aetherteam.aether:aether:${minecraft_version}-${project.aether_version}-fabric")
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }

    from(rootProject.file("common/src/main/resources")) {
        include("resourcepacks/*/")
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
